group = "com.example.appambit_sdk_push_notifications"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}



rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.example.appambit_sdk_push_notifications"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    implementation("com.appambit:appambit.push.notifications:1.2.0")
    implementation 'com.google.firebase:firebase-messaging:23.4.0'
    // appambit.push.notifications:1.2.0's POM declares no dependencies even
    // though MessagingService references okhttp3 directly (it posts the FCM
    // token to AppAmbit's API without going through the core SDK). Without
    // this the app crashes with NoClassDefFoundError the first time a token
    // is registered. Remove once the SDK team republishes with a complete
    // POM. Note: unlike the core `appambit` package, this AAR does NOT
    // reference any com.appambit.sdk classes outside its own package, so it
    // does not need the core `com.appambit:appambit` SDK as a dependency.
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
}
